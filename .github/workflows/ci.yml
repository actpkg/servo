name: CI

# This component is a browser engine, and the build is priced accordingly:
# cargo fetches Servo's full git history (~1.7 GB) before compiling anything,
# and then compiles SpiderMonkey, FreeType, aws-lc-rs and swgl along the way.
# Everything unusual below — freeing disk, installing a C toolchain, the long
# timeout — exists because of that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A cold build is measured in tens of minutes; never run two for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Matches the wasi-sdk the component is verified against locally
  # (34.0, clang 23.1.0); the tested artifact and the published one then
  # come out of the same toolchain.
  WASI_SDK_VERSION: "34.0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Measured cold, nothing cached: 16m31s to fetch and compile, 20m for the job.
    # The headroom is for a slower runner; the ceiling matters because a wedged
    # page would otherwise hold a runner until GitHub's own six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Servo's target directory does not fit next to the runner's preinstalled
      # toolchains. None of these are used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      # The engine compiles C and C++ for wasm32-wasip2; .cargo/config.toml
      # expects the toolchain at this exact path.
      - name: Install wasi-sdk
        run: |
          curl -fsSL --retry 3 -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          /opt/wasi-sdk/bin/clang --version

      - uses: moonrepo/setup-rust@v1
        with:
          bins: just
          # Only one action may own ~/.cargo. This one's post step cleans it by
          # shelling out to cargo, which fails once the cache action below has
          # been through the same directory.
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Caches ~/.cargo only — the registry and the git checkouts, which is where
      # that 1.7 GB fetch lands. Deliberately not target/: it measures 7.8 GB
      # here, so caching it would blow the 10 GB per-repository cache limit on
      # its own and evict everything else. The compile is paid every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2
          cache-targets: "false"
          # ~/.cargo/bin holds rustup's shims and the tools installed above, none
          # of which this build produces. Caching it means pruning it, and the
          # shim it prunes is `cargo` itself.
          cache-bin: "false"

      - run: just build

      - run: just pack

      - run: just test

      - uses: actions/upload-artifact@v7
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/component_servo.wasm
          # It is a ~120 MB artifact; keeping every push for 90 days is waste.
          retention-days: 14
          compression-level: 0

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          components: rustfmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `cargo fmt` reads only the workspace manifest, so this stays cheap — it
      # never fetches the engine.
      - run: cargo fmt --check

  publish:
    name: Publish
    # Only the canonical branch publishes; PRs get build + e2e only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, fmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7

      # The packed artifact the build job just tested — deliberately not a
      # rebuild. `just publish` would drag the engine build (20 minutes and a
      # wasi-sdk install) back in for an artifact the runner already has; the
      # version probe and the push below mirror that recipe instead. The tag
      # comes from the manifest the build packed, and --skip-if-exists makes
      # the whole job idempotent by semver tag.
      - uses: actions/download-artifact@v8
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/

      - uses: sigstore/cosign-installer@v4.1.2   # cosign 3.x → OCI 1.1 referrer signatures

      - name: Publish
        id: publish
        env:
          # actpkg.dev PAT (any username; the registry detects the PAT by
          # prefix). Inherited from the actpkg org as ACTPKG_TOKEN.
          OCI_USERNAME: __token__
          OCI_PASSWORD: ${{ secrets.ACTPKG_TOKEN }}
          # Source repo URL for org.opencontainers.image.source (read by act-build).
          ACT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          WASM=target/wasm32-wasip2/release/component_servo.wasm
          INFO=$(npx @actcore/act inspect component-manifest "$WASM")
          VERSION=$(echo "$INFO" | jq -r .std.version)
          OUTPUT=$(npx @actcore/act-build push "$WASM" "actpkg.dev/library/servo:$VERSION" \
            --skip-if-exists --also-tag latest 2>&1) || { echo "$OUTPUT" >&2; exit 1; }
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | grep "^Digest:" | awk '{print $2}' || true)
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "image=actpkg.dev/library/servo" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign (keyless via GitHub OIDC)
        if: steps.publish.outputs.digest != ''
        env:
          ACTPKG_TOKEN: ${{ secrets.ACTPKG_TOKEN }}
          SUBJECT: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          echo "$ACTPKG_TOKEN" | cosign login actpkg.dev -u __token__ --password-stdin
          cosign sign --yes "$SUBJECT"
